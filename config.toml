# holo-border settings. After editing, run:  holo restart
# Delete a line to fall back to its default.

[border]
size = 3          # border width in px (Omarchy's default is 2)
alpha = 0.9       # border opacity, 1.0 = solid

[colors]
raw = true            # test: use the theme's exact colors (no pastel, clamp or wallpaper adjust)
# Every theme color is clamped into this OKLCH band, so no theme can be harsher
# than the others. Raise chroma_max for more vivid colors, lightness_min for paler.
lightness_min = 0.84
lightness_max = 0.92
chroma_min = 0.075
chroma_max = 0.13
grey_chroma = 0.012   # near-grey theme colors stay neutral at this chroma
contrast = 2.109375   # contrast boost applied before the clamp

[drift]
min_speed = 0.2 
max_speed = 0.6 
leg_min = 1.0         # each leg (one direction) lasts this many seconds ...
leg_max = 6.0         # ... up to this many, then it reverses
ease = 2.5            # how quickly the speed follows its target (1/s)
updates_per_second = 60   # match the monitor refresh rate for smooth motion (costs a little CPU)
idle_updates_per_second = 10   # rate once the fades have finished; the slow drift needs far less


[settle]
after = 3.0           # idle seconds (no focus change) before it slows down
factor = 0.3333       # speed multiplier once settled
ease = 0.8


[adaptive]
# Adapts each border color to what is behind it. The "dominant color" is sampled from
# the wallpaper (source = "wallpaper") or taken from the theme background
# (source = "theme"). Each border color's distance from it (OKLab, ~0-1) sets how
# much that color is boosted: at or above `high` it is left exactly as it is; toward
# `low` it gets more chroma (up to +max_boost) and is pushed lighter/darker away
# from the dominant color (up to `lightness_push` lightness).
enabled = true
source = "wallpaper"
high = 0.60
low = 0.25
max_boost = 0.4
lightness_push = 0.15

[fade_in]
duration = 0.3        # seconds to go from the grey inactive border to the holo gradient
native = true         # true: Hyprland does the fade itself (no flash on switch, but it can look different); false: drift.py does

[shadow]
enabled = true        # focused window only: fades in with the border and stays
range = 5             # size/softness in px
render_power = 3      # falloff: higher = softer edge
alpha = 0.03          # shadow opacity once faded in

[opposites]
fade = 1.5                 # seconds for them to fade back to their normal color after a window is selected

[transparency]
# Scores how bright the wallpaper is (0 = dark, 1 = bright) and sets the border opacity from it,
# overriding border.alpha. Brighter wallpaper = more opaque border so pale colors stay visible.
enabled = true
min_alpha = 0.38      # border opacity on a dark wallpaper
max_alpha = 1.0       # border opacity on a bright wallpaper
dark_l = 0.2          # wallpaper lightness (OKLCH L) that scores 0
bright_l = 0.8        # ... and 1

[legibility]
# Scores the border's contrast against the wallpaper (1 = none, 21 = black on white). If the
# colored stops average below the target, their lightness is moved away from the wallpaper's
# (darker on a bright wallpaper, lighter on a dark one) until they reach it.
enabled = true
target_dark = 2.0     # contrast the colored stops must reach on a dark wallpaper (score 0)
target_bright = 4.0   # ... and on a bright one (score 1); in between it scales with the score
max_shift = 0.45      # most the lightness (OKLCH L) may move

[vividness]
# Boosts the colored stops' chroma by up to max_boost on a bright wallpaper (scaled by the
# brightness score, so none on a dark one). Keeps the darker colors the contrast step needs rich.
enabled = true
max_boost = 0.8       # +80% chroma at score 1

[bands]
colors = 3            # theme colors in the gradient (of 5), chosen and ordered at random on every window switch
