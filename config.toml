# holo-border settings. After editing, run:  holo restart
# Delete a line to fall back to its default.

[border]
angle = 315         # gradient axis in degrees: 315 runs bottom-left -> top-right
size = 3          # border width in px (Omarchy's default is 2)
alpha = 0.9       # border opacity, 1.0 = solid

[colors]
palette = "sticker"   # "theme": the Omarchy theme's colors; "sticker": the holo sticker's pastel rainbow (same on every theme)
raw = true            # test: use the theme's exact colors (no pastel, clamp or wallpaper adjust)
# Every theme color is clamped into this OKLCH band, so no theme can be harsher
# than the others. Raise chroma_max for more vivid colors, lightness_min for paler.
lightness_min = 0.84
lightness_max = 0.92
chroma_min = 0.075
chroma_max = 0.13
grey_chroma = 0.012   # near-grey theme colors stay neutral at this chroma
contrast = 2.109375   # contrast boost applied before the clamp

[adaptive]
# Adapts each border color to what is behind it. The "dominant color" is sampled from
# the wallpaper (source = "wallpaper") or taken from the theme background
# (source = "theme"). Each border color's distance from it (OKLab, ~0-1) sets how
# much that color is boosted: at or above `high` it is left exactly as it is; toward
# `low` it gets more chroma (up to +max_boost) and is pushed lighter/darker away
# from the dominant color (up to `lightness_push` lightness).
enabled = true
source = "wallpaper"
high = 0.60
low = 0.25
max_boost = 0.4
lightness_push = 0.15

[fade_in]
duration = 0.3        # seconds to go from the grey inactive border to the holo gradient
native = false        # true: Hyprland does the fade itself (no flash on switch, but its border animation then runs on every
                      # color update and keeps the screen redrawing at 60 fps: ~4x the CPU); false: drift.py does
updates_per_second = 60   # update rate while a fade is running (match the screen refresh); the rest of the time nothing is sent

[shadow]
enabled = true        # focused window only: fades in with the border and stays
range = 5             # size/softness in px
render_power = 3      # falloff: higher = softer edge
alpha = 0.03          # shadow opacity once faded in

[opposites]
fade = 1.5                 # seconds for them to fade back to their normal color after a window is selected

[transparency]
# Scores how bright the wallpaper is (0 = dark, 1 = bright) and sets the border opacity from it,
# overriding border.alpha. Brighter wallpaper = more opaque border so pale colors stay visible.
enabled = true
min_alpha = 0.69      # border opacity on a dark wallpaper
max_alpha = 1.0       # border opacity on a bright wallpaper
solid_above = 0.85    # a wallpaper scoring above this gets a fully opaque border
dark_l = 0.2          # wallpaper lightness (OKLCH L) that scores 0
bright_l = 0.8        # ... and 1

[legibility]
# Scores the border's contrast against the wallpaper (1 = none, 21 = black on white). If the
# colored stops average below the target, their lightness is moved (lighter or darker, whichever
# reaches it with the smaller move) until they reach it, staying within min/max_lightness.
enabled = true
target_dark = 2.4     # contrast the colored stops must reach on a dark wallpaper (score 0)
target_bright = 4.8   # ... and on a bright one (score 1); in between it scales with the score
max_shift = 0.45      # most the lightness (OKLCH L) may move
min_lightness = 0.66  # dark themes: never darker than this (OKLCH L), so the foil stays colorful, not muddy
max_lightness = 0.94  # never lighter than this, so it never washes out to white; the outline adds the rest

[vividness]
# Boosts the colored stops' chroma by up to max_boost on a bright wallpaper (scaled by the
# brightness score, so none on a dark one). Keeps the darker colors the contrast step needs rich.
enabled = true
max_boost = 0.8       # +80% chroma at score 1

[bands]
# The theme colors are laid out around the color wheel (with a blended color between each pair
# of neighbors) so every band flows into the next. Each window switch picks a random start.
# Hyprland draws at most 10 gradient colors, so colors + highlights is capped at 10: every
# glint or doubled band costs a colored band (fewer, longer bands).
colors = 10           # colored stops in the gradient
highlights = 0        # thin white glints, dropped in at random spots
wide = 0              # up to this many bands are doubled at random, so the widths vary
repeat = 3            # the colors loop this many times along the border (30 bands with 10 colors),
                      # via a patched Hyprland border shader (Hyprland 0.56 only); 1 = no shader patch

[shimmer]
# Each band fades into its neighbor's color. continuous = false does it once per window switch, then
# holds still; continuous = true keeps it flowing all the time, which keeps
# the daemon sending updates (a few % CPU in Hyprland).
enabled = true
continuous = true
seconds_per_band = 2.0    # seconds for each band to fade into the next color
direction = -1             # 1 or -1: which way the bands flow; -1 with angle 315 = toward the top-right (right along the top, up the sides)
updates_per_second = 10   # update rate when continuous (each update is one redraw; the switch fade uses fade_in.updates_per_second)
white_chance = 0.1        # continuous only: each step, the chance a band fades to white instead of into its neighbor

[sweep]
# When focus moves to another window on the same workspace (a switch or a hover), a soft highlight runs
# across the top and bottom of its border, away from the window you came from (left to right when
# you move right, right to left when you move left), then drifts back a little as it fades out
# (bounce). When you
# switch workspaces it runs up the two sides and back down instead (workspace). Each pass fades in
# to its peak opacity (set by the wallpaper brightness) and back out to 0. With periodic = true it
# also repeats every interval_min..interval_max seconds (random, start to start). Drawn by the holo
# shader, so it needs bands.repeat > 1 on Hyprland 0.56; it uses the 10th gradient stop, leaving 9
# for colors.
enabled = true
on_switch = true      # sweep when you switch windows
follow = true         # run it away from the window you came from (false: random direction)
periodic = false      # also sweep every interval_min..interval_max seconds
interval_min = 5.0    # shortest time from one sweep's start to the next, in seconds
interval_max = 30.0   # longest
delay = 0.02          # seconds after a switch before the sweep starts
duration = 0.99       # seconds for the run out, at a steady pace (the drift back adds bounce * duration / back_speed)
bounce = 0.0          # at the far end, drift back this far (fraction of the edge) while fading out (0 = fade out on the way)
back_speed = 0.5      # the drift back (and a full pass back) runs at this fraction of the speed
back = false          # window switch: also run a full pass back the way it came
workspace = ["up", "down"]   # workspace switch: passes up / down the two sides instead ([] = same as a window switch)
style = "glow"        # "glow": a soft highlight that brightens the bands' own colors; "bars": hard white lines
glow_tint = 0.3       # glow: how much of the band's color stays at its brightest point (1 = all, 0 = pure white)
width = 0.14          # glow: how wide it is (it fades out about half this either side); bars: their total length
lines = 1             # bars: this many parallel lines; the leading one is white
line_gap = 0.5        # bars: gap between the lines, as a fraction of one line's width
line_grey = 0.9       # bars: the other lines' lightness (1 = white like the leading one, lower = greyer)
rim = 0.2             # bars: a thin darker rim on each side of the bar, so it pops on pale bands (0 = none)
rim_width = 1.0       # bars: the rim's width, as a fraction of one line's width
distance = 1.0        # how far along the edge it goes: 1 = all the way to the far corner
opacity_dark = 0.95   # the bar's white opacity at the start on a dark wallpaper (brightness score 0)
opacity_bright = 1.0  # ... and on a bright one (score 1); in between it follows the score
fade_in = 0.25        # fraction of the run spent easing in to that opacity; then it fades evenly to 0 by the end
sides = false         # true: some sweeps run up or down the two sides instead of across the top and bottom

[outline]
# A dark keyline around the border, like a sticker's edge (replaces the tinted shadow).
# Its opacity follows the wallpaper brightness score: barely there on a dark wallpaper.
enabled = false
range = 2             # width in px
render_power = 4      # higher = crisper edge
min_alpha = 0.25      # opacity on a dark wallpaper
max_alpha = 0.85      # ... and on a bright one
